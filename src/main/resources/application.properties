spring.application.name=student-management-system

# -------------------------------------------------------------------
# Server
# -------------------------------------------------------------------
server.port=8080

# -------------------------------------------------------------------
# MySQL datasource
# Override with DB_URL, DB_USERNAME and DB_PASSWORD environment
# variables, or edit the default values below.
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update creates/updates the students table automatically.
# Use "validate" or "none" in production and manage the schema manually.
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
